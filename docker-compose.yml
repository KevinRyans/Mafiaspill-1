version: "3.9"
services:
  db:
    image: postgres:15
    container_name: mafiaspill-db
    environment:
      POSTGRES_USER: mafiaspill
      POSTGRES_PASSWORD: mafiaspill
      POSTGRES_DB: mafiaspill
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafiaspill"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    container_name: mafiaspill-redis
    ports:
      - "6379:6379"
volumes:
  db_data:
